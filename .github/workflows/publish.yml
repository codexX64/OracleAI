name: publish

# Image publiée, parce qu'un installeur ne construit pas.
#
# Le Hub qui installe Oracle ne télécharge qu'un fichier Compose : il n'a ni
# le dépôt, ni de quoi bâtir. L'image doit donc exister ailleurs, prête à
# tirer, pour deux architectures.
#
# Rien ici ne nomme personne : le jeton est celui que GitHub fournit à
# l'exécution, les étiquettes OCI sont posées explicitement, et aucune commande
# n'affiche d'identité dans le journal.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRE: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: etiquettes
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRE }}/codexx64/oracle-ai
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Oracle AI
            org.opencontainers.image.description=Duel IA locale contre Claude, juge deterministe
            org.opencontainers.image.vendor=CodexX64
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://codex64.fr
          annotations: |
            org.opencontainers.image.vendor=CodexX64

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          labels: ${{ steps.etiquettes.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
